apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-foodtrack
  namespace: foodtrack
spec:
  ingressClassName: gce
  rules:
  # host: foodtrack pas de hostname valide pour l'instant
  - http:
      paths:
      # Routage par défaut
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: portail-qualite
            port:
              number: 8080
      # Routage pour l'api
      - path: /capteurs/
        pathType: Prefix
        backend:
          service:
            name: api-capteurs
            port:
              number: 8080
