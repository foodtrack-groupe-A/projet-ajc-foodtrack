apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
namespace: foodtrack-prod

secretGenerator:
- name: foodtrack-api-config
  envs:
  - secret.env

patches:
- target:
    kind: Namespace
    name: foodtrack
  patch: |-
    - op: replace
      path: /metadata/name
      value: foodtrack-prod
    - op: replace
      path: /metadata/labels/foodtrack.example~1env
      value: prod
- target:
    kind: ConfigMap
    name: foodtrack-config
  patch: |-
    - op: replace
      path: /data/SEUIL_TEMPERATURE_C
      value: "4"
    - op: replace
      path: /data/NIVEAU_JOURNAL
      value: warn
    - op: replace
      path: /data/index.html
      value: |
        <!doctype html>
        <html lang="fr">
          <head><meta charset="utf-8"><title>FoodTrack - suivi qualite</title></head>
          <body>
            <h1>FoodTrack - suivi qualite</h1>
            <p>Tracabilite de la chaine du froid. API des releves de temperature sous /api/.</p>
            <p>Environnement : prod.</p>
          </body>
        </html>

- target:
    kind: Deployment
    name: portail-qualite
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: replace
      path: /spec/strategy/rollingUpdate/maxSurge
      value: 2

- target:
    kind: Deployment
    name: api-capteurs
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: replace
      path: /spec/strategy/rollingUpdate/maxSurge
      value: 2

- target:
    kind: StatefulSet
    name: cache-releves
  patch: |-
    - op: replace 
      path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
      value: 50Gi

- target:
    kind: Ingress
    name: ingress-foodtrack
  patch: |-
    - op: add
      path: /metadata/annotations/kubernetes.io~1ingress.global-static-ip-name
      value: "ingress-foodtrack-prod-ip"

- path: HPA-foodtrack-patch.yaml
