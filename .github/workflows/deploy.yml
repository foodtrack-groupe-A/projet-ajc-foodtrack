name: CI/CD FoodTrack

on:
  push:
    branches: [ develop, main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: portail-qualite

jobs:
  lint:
    name: Lint des manifestes et du Terraform
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.16.4

    - name: Validation des fichiers Terraform
      run: |
        cd labs/projet-final/terraform
        terraform fmt -check -recursive
        terraform init -backend=false
        terraform validate

    - name: Conformité des manifestes k8s avec Kubeconform
      uses: docker://ghcr.io/yannh/kubeconform:latest
      with:
        args: -summary -ignore-filename-pattern kustomization.yaml -output json labs/projet-final/manifests/base

  trivy-config:
    name: Scan Trivy des configurations
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
    - name: Récupération du dépôt
      uses: actions/checkout@v5
    - name: Scan Terraform et Kubernetes
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        scan-type: config
        scan-ref: labs/projet-final
        format: table
        severity: HIGH,CRITICAL
        exit-code: "0"
        hide-progress: true

  trivy-images_tierces:
    name: Scan de l'image ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    strategy:
      matrix:
        image:
        - nginx:1.30.5
        - us-docker.pkg.dev/google-samples/containers/gke/hello-app:2.0
        - redis:8.10.1

    steps:
    - name: Scan de l'image
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        scan-type: image
        image-ref: ${{ matrix.image }}
        format: table
        severity: CRITICAL
        exit-code: "0"
        ignore-unfixed: true
        hide-progress: true
        version: latest

  changements-terraform:
    name: Prévisualisation des changements Terraform
    runs-on: ubuntu-latest
    needs: trivy-config
    steps:
    - uses: actions/checkout@v5

    - name: Prévisualisation des changements Terraform
      working-directory: labs/projet-final/terraform
      run: |
        TARGET_BRANCH="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"

        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          ENVIRONMENT="prod"
          TFVARS_FILE="prod.tfvars"
        else
          case "$TARGET_BRANCH" in
            develop)
              ENVIRONMENT="dev"
              TFVARS_FILE="dev.tfvars"
              ;;
            test)
              ENVIRONMENT="test"
              TFVARS_FILE="test.tfvars"
              ;;
            main)
              ENVIRONMENT="prod"
              TFVARS_FILE="prod.tfvars"
              ;;
            *)
              echo "Branche non prise en charge : $TARGET_BRANCH"
              exit 1
              ;;
          esac
        fi

        echo "Environnement sélectionné : $ENVIRONMENT"
        echo "Fichier utilisé : $TFVARS_FILE"
        set +e

        terraform plan \
          -var-file="$TFVARS_FILE" \
          -input=false \
          -no-color \
          -detailed-exitcode | tee plan.txt

        PLAN_CODE=${PIPESTATUS[0]}
        set -e

        if [ "$PLAN_CODE" -eq 0 ]; then
          STATUS="Aucun changement"
        elif [ "$PLAN_CODE" -eq 2 ]; then
          STATUS="Changements détectés"
        else
          STATUS="Erreur pendant le terraform plan"
        fi

        RESUME=$(grep -E "^(Plan:|No changes\.)" plan.txt | tail -n 1 || true)

        {
          echo "## Terraform plan — $ENVIRONMENT"
          echo
          echo "$STATUS"
          echo
          echo "${RESUME:-Consulter les logs pour plus de détails.}"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$PLAN_CODE" -eq 1 ]; then
          exit 1
        fi

  build:
    name: Build et publication de l'image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [trivy-config, trivy-images_tierces]
    steps:
    - uses: actions/checkout@v5

    - id: auth
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ vars.WIF_PROVIDER }}
        service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

    - uses: google-github-actions/setup-gcloud@v3

    - name: Autoriser Docker auprès d'Artifact Registry
      run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

    - name: Construire et publier l'image
      uses: docker/build-push-action@v7
      with:
        context: labs/projet-final
        file: labs/projet-final/Dockerfile
        push: true
        tags: |
          ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

    - name: Scan Trivy de l'image construite
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
      with:
        scan-type: image
        image-ref: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        format: table
        severity: HIGH,CRITICAL
        exit-code: "0"

  deploy-dev:
    name: Déploiement dev
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: develop
    steps:
    - uses: actions/checkout@v5

    - id: auth
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ vars.WIF_PROVIDER }}
        service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

    - uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: ${{ vars.GKE_CLUSTER }}
        location: ${{ vars.GCP_ZONE }}

    - name: Créer le secret pour kustomize
      run: |
        kubectl create secret generic api-capteurs-secrets \
          --namespace=foodtrack-dev \
          --from-literal=CACHE_PASSWORD="${{ secrets.CACHE_PASSWORD }}" \
          --from-literal=INGEST_TOKEN="${{ secrets.INGEST_TOKEN }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Application des manifests Kustomize (dev)
      run: |
        cd labs/projet-final/manifests/overlays/dev
        kustomize edit set image ${{ env.IMAGE_NAME }}=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        kubectl apply -k .

    - name: Attendre la fin du déploiement
      run: |
        kubectl rollout status deployment/api-capteurs -n foodtrack-dev --timeout=180s || true
        kubectl rollout status deployment/portail-qualite -n foodtrack-dev --timeout=180s || true

    - name: Vérifier que l'API répond
      run: |
        SERVICE_PORT=$(kubectl get service "api-capteurs" --namespace="foodtrack-dev" --output=jsonpath='{.spec.ports[0].port}')
        kubectl port-forward "service/api-capteurs" "8080:$SERVICE_PORT" --namespace="foodtrack-dev" > "$RUNNER_TEMP/api-port-forward.log" 2>&1 &
        PORT_FORWARD_PID=$!
        trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

        for TENTATIVE in {1..12}; do
          if curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:8080/"; then
            echo "L'API répond correctement."
            exit 0
          fi
          echo "Tentative $TENTATIVE/12 : API indisponible."
          sleep 5
        done
        exit 1

  deploy-test:
    name: Déploiement test
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: test
    steps:
    - uses: actions/checkout@v5

    - id: auth
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ vars.WIF_PROVIDER }}
        service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

    - uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: ${{ vars.GKE_CLUSTER }}
        location: ${{ vars.GCP_ZONE }}

    - name: Application des manifests Kustomize (test)
      run: |
        cd labs/projet-final/manifests/overlays/test
        kustomize edit set image ${{ env.IMAGE_NAME }}=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        kubectl apply -k .

    - name: Attendre la fin du déploiement
      run: |
        kubectl rollout status deployment/api-capteurs -n foodtrack-test --timeout=180s || true

  deploy-prod:
    name: Déploiement production
    needs: deploy-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # Exige la validation humaine dans GitHub Actions
    steps:
    - uses: actions/checkout@v5

    - id: auth
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ vars.WIF_PROVIDER }}
        service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

    - uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: ${{ vars.GKE_CLUSTER }}
        location: ${{ vars.GCP_ZONE }}

    - name: Application des manifests Kustomize (prod)
      run: |
        cd labs/projet-final/manifests/overlays/prod
        kustomize edit set image ${{ env.IMAGE_NAME }}=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        kubectl apply -k .

    - name: Attendre la fin du déploiement
      run: |
        kubectl rollout status deployment/api-capteurs -n foodtrack-prod --timeout=180s || true