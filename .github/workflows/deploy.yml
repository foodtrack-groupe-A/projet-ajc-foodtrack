name: CI/CD FoodTrack

# FoodTrack - projet final - squelette de workflow GitHub Actions
#
# A COPIER dans .github/workflows/deploy.yml de votre depot, puis a completer.
#
# Ce qui est fourni : le bloc d authentification sans cle (OIDC vers Google
# Cloud) et la recuperation des acces au cluster. Ces deux etapes sont les plus
# penibles a mettre au point et ne portent aucune valeur pedagogique une fois
# comprises - en revanche, vous devez savoir les EXPLIQUER en soutenance.
#
# Ce qui est a votre charge : tout le reste, marque "A FAIRE".
#
# Variables a definir dans Settings > Secrets and variables > Actions > Variables :
#   GCP_PROJECT_ID        ex: foodtrack-equipe-a
#   GCP_REGION            ex: europe-west8
#   GCP_ZONE              ex: europe-west8-b
#   GKE_CLUSTER           ex: foodtrack-a-cluster
#   WIF_PROVIDER          sortie Terraform "wif_provider_name" du module fourni
#   CI_SERVICE_ACCOUNT    sortie Terraform "ci_service_account_email"
#
# Aucun SECRET n est necessaire. Si vous en ajoutez un qui contient une cle
# JSON, vous avez rate l exercice.

on:
  push:
    branches: [ develop, main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ develop, main ]

# Obligatoire pour que GitHub emette un jeton OIDC.
# Sans "id-token: write", l etape d authentification echoue sans explication utile.
permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: portail-qualite

jobs:
  lint:
    name: Lint des manifestes et du Terraform
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.16.4

    - name: Validation des fichiers Terraform
      run: |
        cd labs/projet-final/terraform
        terraform fmt -check -recursive
        terraform init -backend=false
        terraform validate

    - name: Conformité des manifestes k8s avec Kubeconform
      uses: docker://ghcr.io/yannh/kubeconform:latest
      with:
        args: -summary -output json labs/projet-final/manifests/base/*.yaml labs/projet-final/manifests/overlays/*/*.yaml

    - name: Bonnes pratiques Kubernetes avec KubeLinter
      continue-on-error: true
      uses: stackrox/kube-linter-action@v1.0.7
      with:
        directory: labs/projet-final/manifests
        version: latest
        format: plain
        fail-on-invalid-resource: true

  trivy-config:
    name: Scan Trivy des configurations
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
    - name: Récupération du dépôt
      uses: actions/checkout@v4
    - name: Scan Terraform et Kubernetes
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        scan-type: config
        scan-ref: labs/projet-final
        format: table
        severity: HIGH,CRITICAL
        exit-code: "0"
        hide-progress: true

  trivy-images_tierces:
    name: Scan de l'image ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    strategy:
      matrix:
        image:
        - nginx:1.30.5
        - us-docker.pkg.dev/google-samples/containers/gke/hello-app:2.0
        - redis:8.10.1

    steps:
    - name: Scan de l'image
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        scan-type: image
        image-ref: ${{ matrix.image }}
        format: table
        severity: HIGH,CRITICAL
        exit-code: "0"
        ignore-unfixed: true
        hide-progress: true
        version: latest

    - name: Prévisualisation des changements Terraform
      working-directory: labs/projet-final/terraform
      run: |
        TARGET_BRANCH="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"

        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          ENVIRONMENT="prod"
          TFVARS_FILE="prod.tfvars"
        else
          case "$TARGET_BRANCH" in
            develop)
              ENVIRONMENT="dev"
              TFVARS_FILE="dev.tfvars"
              ;;
            test)
              ENVIRONMENT="test"
              TFVARS_FILE="test.tfvars"
              ;;
            main)
              ENVIRONMENT="prod"
              TFVARS_FILE="prod.tfvars"
              ;;
            *)
              echo "Branche non prise en charge : $TARGET_BRANCH"
              exit 1
              ;;
          esac
        fi

        echo "Environnement sélectionné : $ENVIRONMENT"
        echo "Fichier utilisé : $TFVARS_FILE"
        set +e

        terraform plan \
          -var-file="$TFVARS_FILE" \
          -input=false \
          -no-color \
          -detailed-exitcode | tee plan.txt

        PLAN_CODE=${PIPESTATUS[0]}
        set -e

        if [ "$PLAN_CODE" -eq 0 ]; then
          STATUS="Aucun changement"
        elif [ "$PLAN_CODE" -eq 2 ]; then
          STATUS="Changements détectés"
        else
          STATUS="Erreur pendant le terraform plan"
        fi

        RESUME=$(grep -E "^(Plan:|No changes\.)" plan.txt | tail -n 1 || true)

        {
          echo "## Terraform plan — dev"
          echo
          echo "$STATUS"
          echo
          echo "${RESUME:-Consulter les logs pour plus de détails.}"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$PLAN_CODE" -eq 1 ]; then
          exit 1
        fi

  build:
    name: Build et publication de l image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [trivy-config, trivy-images_tierces]
    steps:
    - uses: actions/checkout@v5

    # --- FOURNI : authentification sans cle -------------------------------
    # GitHub emet un jeton OIDC signe qui decrit l execution en cours (depot,
    # branche, auteur). Google Cloud verifie cette signature aupres de GitHub,
    # applique la condition d attribut definie dans le fournisseur, puis rend
    # un jeton d acces au nom du compte de service demande.
    - id: auth
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ vars.WIF_PROVIDER }}
        service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

    - uses: google-github-actions/setup-gcloud@v3

    - name: Autoriser Docker aupres d Artifact Registry
      run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
    # --- fin du bloc fourni ------------------------------------------------

    # A FAIRE : construire l image et la pousser dans Artifact Registry
    #        piste : docker/build-push-action@v7
    #        etiquetez l image avec le SHA du commit : une etiquette "latest"
    #        rend impossible de dire quelle version tourne en production.
    - name: Construire et publier l'image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}

    # A FAIRE : scanner l image publiee avant tout deploiement
    - name: A completer
      run: |
        gcloud artifacts docker images scan \
          ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:{{ github.sha }} \
          --format='value(response.scan)' \
          --location=${{ vars.GCP_REGION }}

  deploy-dev:
    name: Deploiement dev
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: develop #run seulement si c'est dans l'environnement de développement, 'develop'
    steps:
    - uses: actions/checkout@v5

    # --- FOURNI : acces au cluster ----------------------------------------
    - id: auth
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ vars.WIF_PROVIDER }}
        service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

    - uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: ${{ vars.GKE_CLUSTER }}
        location: ${{ vars.GCP_ZONE }}
    # --- fin du bloc fourni ------------------------------------------------

    - name: Créer le secret pour kustomize
      run: |
        kubectl create secret generic api-capteurs-secrets \
          --namespace=foodtrack-dev \
          --from-literal=CACHE_PASSWORD="${{ secrets.CACHE_PASSWORD }}" \
          --from-literal=INGEST_TOKEN="${{ secrets.INGEST_TOKEN }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Application des manifests de l'environnement dev
      run: |
        gcloud container clusters get-credentials foodtrack-a-cluster --zone europe-west8-b
        kubectl config use-context gke_${{ vars.GCP_PROJECT_ID}}_${{ vars.GCP_ZONE }}_${{ vars.GKE_CLUSTER }}
        kubectl config set contexts.gke_${{ vars.GCP_PROJECT_ID}}_${{ vars.GCP_ZONE }}_${{ vars.GKE_CLUSTER }}.namespace foodtrack-dev
        kubectl apply -f labs/projet-final/manifests/overlays/dev

    # A FAIRE : mettre a jour l image du deploiement api-capteur

    - name: Attendre la fin du déploiement de l'API
      run: |
        kubectl rollout status \
          "deployment/api-capteurs" \
          --namespace="foodtrack-dev" \
          --timeout=180s

    - name: Vérifier que l'API répond
      run: |
        SERVICE_PORT=$(kubectl get service "api-capteurs" \
          --namespace="foodtrack-dev" \
          --output=jsonpath='{.spec.ports[0].port}')

        kubectl port-forward \
          "service/api-capteurs" \
          "8080:$SERVICE_PORT" \
          --namespace="foodtrack-dev" \
          > "$RUNNER_TEMP/api-port-forward.log" 2>&1 &

        PORT_FORWARD_PID=$!

        trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

        for TENTATIVE in {1..12}; do
          if curl \
            --fail \
            --silent \
            --show-error \
            --max-time 5 \
            "http://127.0.0.1:8080/"; then
            echo
            echo "L'API répond correctement."
            exit 0
          fi

          echo "Tentative $TENTATIVE/12 : API indisponible."
          sleep 5
        done

        echo "L'API ne répond pas après 60 secondes."
        cat "$RUNNER_TEMP/api-port-forward.log"
        kubectl get pods --namespace="foodtrack-dev"
        exit 1

  deploy-test:
    name: Deploiement test
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
    # A FAIRE : meme structure que deploy-dev, sur le namespace de test
    - name: Attendre la fin du déploiement de l'API
      run: |
        kubectl rollout status \
          "deployment/api-capteurs" \
          --namespace="foodtrack-test" \
          --timeout=180s

    - name: Vérifier que l'API répond
      run: |
        SERVICE_PORT=$(kubectl get service "api-capteurs" \
          --namespace="foodtrack-test" \
          --output=jsonpath='{.spec.ports[0].port}')

        kubectl port-forward \
          "service/api-capteurs" \
          "8080:$SERVICE_PORT" \
          --namespace="foodtrack-test" \
          > "$RUNNER_TEMP/api-port-forward.log" 2>&1 &

        PORT_FORWARD_PID=$!

        trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

        for TENTATIVE in {1..12}; do
          if curl \
            --fail \
            --silent \
            --show-error \
            --max-time 5 \
            "http://127.0.0.1:8080/"; then
            echo
            echo "L'API répond correctement."
            exit 0
          fi

          echo "Tentative $TENTATIVE/12 : API indisponible."
          sleep 5
        done

        echo "L'API ne répond pas après 60 secondes."
        cat "$RUNNER_TEMP/api-port-forward.log"
        kubectl get pods --namespace="foodtrack-test"
        exit 1

  deploy-prod:
    name: Deploiement production
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
    - name: Attendre la fin du déploiement de l'API
      run: |
        kubectl rollout status \
          "deployment/api-capteurs" \
          --namespace="foodtrack-prod" \
          --timeout=180s

    - name: Vérifier que l'API répond
      run: |
        SERVICE_PORT=$(kubectl get service "api-capteurs" \
          --namespace="foodtrack-prod" \
          --output=jsonpath='{.spec.ports[0].port}')

        kubectl port-forward \
          "service/api-capteurs" \
          "8080:$SERVICE_PORT" \
          --namespace="foodtrack-prod" \
          > "$RUNNER_TEMP/api-port-forward.log" 2>&1 &

        PORT_FORWARD_PID=$!

        trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

        for TENTATIVE in {1..12}; do
          if curl \
            --fail \
            --silent \
            --show-error \
            --max-time 5 \
            "http://127.0.0.1:8080/"; then
            echo
            echo "L'API répond correctement."
            exit 0
          fi

          echo "Tentative $TENTATIVE/12 : API indisponible."
          sleep 5
        done

        echo "L'API ne répond pas après 60 secondes."
        cat "$RUNNER_TEMP/api-port-forward.log"
        kubectl get pods --namespace="foodtrack-prod"
        exit 1

    # A FAIRE : cet environnement doit exiger une approbation humaine.
    #        Elle se configure cote depot : Settings > Environments > required
    #        reviewers. Le job attend alors qu un relecteur valide.
    #        Un "if" dans le workflow ne remplace pas une porte d approbation :
    #        il filtre, il ne demande rien a personne.
    # environment:
    #   name: production
    # A FAIRE : deploiement en production, puis verification
    # A FAIRE : decider et documenter ce qui declenche la production :
    #        un merge sur main, une etiquette de version, ou les deux
    - name: A completer
      run: echo "a remplacer par vos etapes"
